services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ai-whiteboard-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sujal011-ai-whiteboard-db-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Uncomment if you want to run the API in Docker as well
  # api:
  #   build: .
  #   ports:
  #     - "3001:3001"
  #   environment:
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_NAME: workspace_app
  #     DB_USER: postgres
  #     DB_PASSWORD: password
  #     QDRANT_URL: http://qdrant:6333
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     qdrant:
  #       condition: service_healthy
  #   volumes:
  #     - .:/app
  #     - /app/node_modules

volumes:
  postgres_data:
  qdrant_data: